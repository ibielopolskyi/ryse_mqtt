title: Overview 3D
views:
- title: Home
  path: home
  icon: mdi:home-variant
  type: masonry
  theme: Backend-selected
  background: 'radial-gradient(1200px 600px at 10% -10%, rgba(90,140,255,0.18), transparent 60%), radial-gradient(1000px 500px
    at 110% 10%, rgba(255,140,80,0.18), transparent 55%), linear-gradient(160deg, #0a0d1c 0%, #10152b 40%, #0a0d1c 100%) fixed'
  cards:
  - type: markdown
    content: |-
      <ha-icon icon="mdi:weather-partly-cloudy" style="--mdc-icon-size: 72px; color: #ffd479; filter: drop-shadow(0 8px 20px rgba(255,170,60,0.45));"></ha-icon>

      ## Hello, Igor
      ### {{ now().strftime('%A, %B %d') }} · {{ now().strftime('%H:%M') }}
      **{{ states('weather.forecast_home') | title }}** · {{ state_attr('weather.forecast_home','temperature') }}°C · Humidity {{ state_attr('weather.forecast_home','humidity') }}% · Wind {{ state_attr('weather.forecast_home','wind_speed') }} km/h
    card_mod:
      style: |2

        ha-card {
          background:
            radial-gradient(120% 120% at 0% 0%, rgba(255,200,120,0.20), transparent 55%),
            radial-gradient(120% 120% at 100% 100%, rgba(80,130,255,0.25), transparent 60%),
            linear-gradient(160deg, rgba(18,22,40,0.85), rgba(10,12,24,0.92));
          border-radius: 28px;
          border: 1px solid rgba(255,255,255,0.10);
          box-shadow:
            0 24px 60px rgba(0,0,0,0.55),
            inset 0 1px 0 rgba(255,255,255,0.18);
          color: #f5f7ff;
          padding: 22px 26px;
          transform: perspective(1200px) rotateX(1deg);
          transform-origin: top center;
        }
        ha-markdown h2 { margin: 6px 0 2px 0; font-size: 28px; letter-spacing: .3px; }
        ha-markdown h3 { margin: 0 0 10px 0; font-weight: 400; opacity: .8; }
        ha-markdown p { margin: 6px 0; opacity: .92; }
  - type: horizontal-stack
    cards:
    - type: custom:button-card
      entity: scene.curtains_open
      name: Open curtains
      icon: mdi:blinds-horizontal
      show_state: false
      tap_action:
        action: call-service
        service: scene.turn_on
        service_data:
          entity_id: scene.curtains_open
      styles:
        card:
        - border-radius: 24px
        - padding: 14px
        - background: linear-gradient(145deg, rgba(255,255,255,0.10), rgba(0,0,0,0.25))
        - box-shadow: 0 12px 30px rgba(0,0,0,0.55), -6px -6px 16px rgba(255,255,255,0.05), 6px 6px 16px rgba(0,0,0,0.55),
            inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(0,0,0,0.35)
        - border: 1px solid rgba(255,255,255,0.10)
        - color: '#eef2ff'
        - transition: transform .2s ease, box-shadow .2s ease
        - transform-style: preserve-3d
        - perspective: 600px
        img_cell:
        - background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.02))
        - border-radius: 50%
        - width: 54px
        - height: 54px
        - margin-right: 8px
        - box-shadow: inset 0 2px 4px rgba(255,255,255,0.25), inset 0 -2px 4px rgba(0,0,0,0.35), 0 6px 14px rgba(0,0,0,0.45)
        icon:
        - color: '#cfe2ff'
        - width: 30px
        name:
        - font-size: 14px
        - font-weight: '600'
        - color: '#f2f5ff'
        - text-align: start
        - justify-self: start
        state:
        - font-size: 11px
        - opacity: '0.75'
        - text-align: start
        - justify-self: start
        grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: auto 1fr
        - grid-template-rows: 1fr 1fr
      state:
      - value: 'on'
        styles:
          card:
          - background: linear-gradient(145deg, rgba(255,221,120,0.55), rgba(255,150,0,0.25))
          - box-shadow: 0 14px 38px rgba(255,170,60,0.45), 0 6px 14px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.45),
              inset 0 -1px 0 rgba(0,0,0,0.30)
          icon:
          - color: '#fff4c2'
          img_cell:
          - background: radial-gradient(circle at 30% 30%, rgba(255,240,200,0.95), rgba(255,165,0,0.35))
      - value: open

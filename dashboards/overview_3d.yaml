    card_mod:
      style: |2

        ha-card {
          padding: 0 !important;
          margin: 0 !important;
          border: none !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          background:
            radial-gradient(1400px 700px at 15% -10%, rgba(90,140,255,0.22), transparent 60%),
            radial-gradient(1200px 600px at 110% 110%, rgba(255,140,80,0.20), transparent 60%),
            linear-gradient(160deg, #07091a 0%, #0d1228 45%, #07091a 100%) !important;
          height: 100vh;
          width: 100%;
          overflow: hidden;
          position: relative;
        }
        ha-card hui-image, ha-card .image {
          height: 100% !important;
          width: 100% !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
        }
        ha-card hui-image img, ha-card img {
          width: 100% !important;
          height: 100% !important;
          object-fit: contain !important;
          filter: drop-shadow(0 40px 80px rgba(0,0,0,0.75));
        }
        .element ha-icon, .element state-badge, .element state-icon {
          transition: transform .22s ease, filter .22s ease;
        }
        .element:hover ha-icon, .element:hover state-badge {
          transform: translate(-50%, -50%) scale(1.35) !important;
          filter: drop-shadow(0 10px 24px rgba(255,255,255,0.35)) !important;
        }
